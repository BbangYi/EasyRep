name: Temporary environment MLP evaluation

on:
  push:
    branches:
      - codex/environment-mlp-weights-20261001
    paths:
      - .github/workflows/temporary-environment-mlp-evaluation.yml

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out model files
        uses: actions/checkout@v4
        with:
          ref: c332f71686992222867895e1554435fca17a9501
          path: model-repo
          persist-credentials: false
      - name: Check out gateway source
        uses: actions/checkout@v4
        with:
          ref: 2f87006b02e3afa26cd660c7103c4c14acc54452
          path: gateway-repo
          persist-credentials: false
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install evaluation dependency
        run: python -m pip install numpy==1.26.4
      - name: Verify and evaluate the synthetic model
        shell: bash
        run: |
          set -euo pipefail
          runtime="$(mktemp -d "$RUNNER_TEMP/environment-mlp.XXXXXXXX")"
          case "$runtime" in "$RUNNER_TEMP"/environment-mlp.*) ;; *) exit 1 ;; esac
          trap 'rm -rf -- "$runtime"' EXIT
          cp "$GITHUB_WORKSPACE/model-repo/models/environment-mlp/2026-10-01/"*.npz "$runtime/"
          cp "$GITHUB_WORKSPACE/model-repo/models/environment-mlp/2026-10-01/"{training_report.json,SHA256SUMS} "$runtime/"
          (cd "$runtime" && sha256sum --check SHA256SUMS)
          export HABITAT_ENV_MODEL_DIR="$runtime"
          export OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=1
          cd "$GITHUB_WORKSPACE/gateway-repo/gateway"
          python experiments/environment_sim/predictive_misting.py --evaluate --check
