<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HabitatOS · 실시간 카메라</title>
<style>
:root{font-family:system-ui,sans-serif;color:#e9f2ec;background:#111b17;color-scheme:dark}
*{box-sizing:border-box}body{margin:0}main{max-width:1440px;margin:0 auto;padding:24px}
header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}
h1{font-size:24px;margin:6px 0}h2{font-size:18px;margin:0}p{color:#acbeb3;line-height:1.6}small{color:#b8d2c2}
button,input,select{font:inherit;padding:12px;border:1px solid #425e4e;border-radius:8px;background:#20382a;color:#fff}
button{cursor:pointer}input{width:100%;margin:12px 0}form{max-width:420px;margin:64px auto;padding:28px;border:1px solid #354d40;border-radius:16px}
button:disabled{cursor:not-allowed;opacity:.45}.ir-panel{margin:16px 0 20px}.ir-panel p{margin:8px 0}.ir-panel .toolbar{margin-bottom:8px}
#ir-unlock{max-width:560px;margin:14px 0 0;padding:0;border:0}#ir-off{border-color:#b79c76}#ir-error{color:#f2bda6}#ir-remaining{font-variant-numeric:tabular-nums}
.toolbar,.panel-heading{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0}
.panel-heading{justify-content:space-between;margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.panel{padding:18px;border:1px solid #354d40;border-radius:16px;min-width:0}
video{display:block;width:100%;background:#000;aspect-ratio:4/3;border-radius:10px}
.status{min-height:1.5em;color:#d5c7a5}.status.live{color:#9be6b5}.details{font-size:14px;overflow-wrap:anywhere}
.empty{display:grid;place-items:center;aspect-ratio:4/3;background:#0b120e;border-radius:10px;color:#a5b7ac}
#notice,#error{color:#f2bda6}[hidden]{display:none!important}
@media(max-width:800px){main{padding:16px}.grid{grid-template-columns:1fr}h1{font-size:20px}form{margin:30px auto;padding:20px}}
</style>
<script src="/camera/hls.js"></script>
</head>
<body><main>
<header><div><small>HabitatOS</small><h1>실시간 카메라</h1><small id="site"></small></div><button id="logout" hidden>연결 해제</button></header>
<form id="login"><label for="key">영상 또는 제어 키</label><input id="key" type="password" autocomplete="off" required><button type="submit">카메라 보기</button><p>영상 키로 카메라를 보고, 제어 키로 IR 조명도 조작할 수 있습니다.</p><p id="error" role="alert"></p></form>
<section id="viewer" hidden>
  <div class="toolbar"><label for="cages">사육장</label><select id="cages" aria-label="사육장 선택"></select><button id="retry">상태 새로고침</button></div>
  <section id="ir-panel" class="panel ir-panel" aria-labelledby="ir-title">
    <h2 id="ir-title">IR 조명</h2><p id="ir-status" class="status" role="status">조명 상태 확인 중</p>
    <div class="toolbar"><label for="ir-seconds">자동 끄기</label><select id="ir-seconds"><option value="continuous" selected>사용 안 함 · 계속 켜기</option><option value="10">10초 후</option><option value="60">1분 후</option><option value="300">5분 후</option><option value="900">15분 후</option></select><button id="ir-on" type="button" disabled>계속 켜기</button><button id="ir-off" type="button" disabled>IR 끄기</button><span id="ir-remaining"></span></div>
    <p class="details">기본은 계속 켜기입니다. 자동 끄기는 필요할 때 선택하세요. 계속 켜기는 브라우저를 닫아도 유지됩니다.</p>
    <p class="details">실제 점등은 영상이나 현장에서 확인하세요.</p>
    <form id="ir-unlock" hidden><label for="ir-key">IR 제어 키</label><input id="ir-key" type="password" autocomplete="off" required><button type="submit">제어 연결</button><p class="details">현재 영상 보기 전용입니다. 관리자가 제공한 제어 키를 입력하세요.</p></form>
    <p id="ir-error" role="alert"></p>
  </section>
  <p id="notice" role="status"></p><div id="grid" class="grid"></div>
  <p>TOP은 천장, FRONT는 전면 영상입니다. 각 카메라의 연결 상태를 따로 확인하며, 연결이 끊기면 해당 영상의 재생을 멈춥니다. 영상에는 몇 초 지연이 있습니다.</p>
</section>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const viewNames = {top: '천장 · TOP', front: '전면 · FRONT'};
const messages = {
  live_stream_disabled: '실시간 영상이 꺼져 있습니다',
  waiting_network_camera_binding: '카메라 주소 등록 대기',
  waiting_usb_port_binding: 'USB 카메라 등록 대기',
  waiting_camera: '카메라 연결 대기',
  waiting_video_frames: '첫 영상 수신 대기',
  waiting_fresh_video: '최신 영상 수신 대기',
  capture_failed_check_network_stream: '카메라 연결 끊김 · 재연결 대기',
  camera_frame_stale: '새 영상이 들어오지 않습니다',
  capture_failed_check_ffmpeg: '영상 수신 프로그램 확인 필요',
  capture_failed_check_uvc_formats: '카메라 영상 형식 확인 필요',
  archive_full: '영상 저장 공간 확인 필요'
};
let inventory = [], panels = new Map(), layout = '', pollTimer = null, generation = 0;
const fragment = new URLSearchParams(location.hash.slice(1));
let incoming = fragment.get('control_key') || fragment.get('key');
fragment.delete('control_key'); fragment.delete('key');
if (location.hash) history.replaceState(null, '', location.pathname);
const ir = {cage: '', data: null, fresh: false, canControl: false, csrf: null, pending: null, error: '', timer: null, epoch: 0, command: 0};
const pendingOn = new Map();

async function request(path, options = {}) {
  const controller = new AbortController(), timeout = setTimeout(() => controller.abort(), 5000);
  try {
    return await fetch(path, {...options, signal: controller.signal, credentials: 'same-origin', cache: 'no-store', redirect: 'error'});
  } finally { clearTimeout(timeout); }
}

function resetIR(clearAuth = false) {
  ir.epoch++; ir.command++; clearTimeout(ir.timer); ir.timer = null;
  ir.cage = ''; ir.data = null; ir.fresh = false; ir.pending = null; ir.error = '';
  if (clearAuth) { ir.canControl = false; ir.csrf = null; $('ir-key').value = ''; }
  renderIR();
}
function renderIR() {
  const data = ir.data, configured = data?.configured === true;
  $('ir-title').textContent = (ir.cage ? ir.cage + ' · ' : '') + 'IR 조명';
  const labels = {unconfigured: '이 사육장에는 IR 제어가 등록되지 않았습니다', offline: '조명 보드 연결 대기', locked: '조명 출력이 잠겨 있습니다', off: 'IR 꺼짐 (보드 응답)', on: 'IR 켜짐 (보드 응답)', starting: 'IR 켜기 응답 대기', stopping: 'IR 끄기 응답 대기', error: '조명 상태 확인 필요'};
  let status = !ir.cage ? '사육장을 선택하세요' : data ? labels[data.status] || '조명 상태 확인 중' : '조명 상태 확인 중';
  if (data && !ir.fresh) status = '조명 연결 상태를 다시 확인하고 있습니다';
  if (ir.pending) status = ir.pending === 'on' ? 'IR 켜기 요청 중' : 'IR 끄기 요청 중';
  $('ir-status').textContent = status;
  $('ir-status').classList.toggle('live', ir.fresh && data?.status === 'on' && !ir.pending);
  const max = Number(data?.max_on_seconds) || 900;
  for (const option of $('ir-seconds').options) option.disabled = option.value !== 'continuous' && Number(option.value) > max;
  if ($('ir-seconds').selectedOptions[0]?.disabled) {
    const allowed = [...$('ir-seconds').options].filter(option => !option.disabled);
    $('ir-seconds').value = allowed.at(-1)?.value || '';
  }
  $('ir-on').textContent = $('ir-seconds').value === 'continuous' ? '계속 켜기' : 'IR 켜기';
  $('ir-seconds').disabled = !ir.canControl || !configured || Boolean(ir.pending);
  $('ir-on').disabled = !ir.canControl || !configured || !ir.fresh || data?.online !== true || data?.outputs_locked !== false || data?.active === true || Boolean(ir.pending) || pendingOn.has(ir.cage) || !['off', 'on'].includes(data?.status) || !$('ir-seconds').value;
  // OFF remains available when the board is offline, or an ON request is pending.
  $('ir-off').disabled = !ir.canControl || !configured || ir.pending === 'off';
  $('ir-unlock').hidden = ir.canControl;
  $('ir-error').textContent = ir.error;
  const remaining = Math.max(0, Math.ceil(Number(data?.remaining_s) || 0));
  $('ir-remaining').textContent = !ir.fresh || !data?.active ? ''
    : data.mode === 'continuous' && data.status === 'on' ? '계속 켜짐 · 끄기를 누르면 종료'
    : data.mode === 'timed' && remaining ? '자동 끄기까지 ' + remaining + '초' : '';
}
async function loadControl(active) {
  try {
    const response = await request('/camera/control/session');
    if (active !== generation) return;
    if (response.status === 401) { loginView(); return; }
    if (!response.ok) throw Error();
    const data = await response.json();
    if (active !== generation) return;
    ir.canControl = data.can_control === true && typeof data.csrf_token === 'string' && Boolean(data.csrf_token);
    ir.csrf = ir.canControl ? data.csrf_token : null;
  } catch (_) {
    if (active !== generation) return;
    ir.canControl = false; ir.csrf = null; ir.error = '제어 권한을 확인하지 못했습니다. 상태를 새로고침해 주세요.';
  }
  renderIR();
}
function selectIR() {
  if (ir.cage === $('cages').value) return;
  resetIR(); ir.cage = $('cages').value; renderIR();
  if (ir.cage) pollIR(ir.epoch, generation);
}
async function pollIR(epoch, active) {
  const cage = ir.cage, command = ir.command;
  const current = () => active === generation && epoch === ir.epoch && cage === ir.cage;
  try {
    if (!ir.pending) {
      const response = await request('/camera/api/ir/' + encodeURIComponent(cage));
      if (!current()) return;
      if (response.status === 401) { loginView(); return; }
      if (!response.ok) throw Error();
      const data = await response.json();
      if (!current() || command !== ir.command) return;
      if (data.cage_id !== cage) throw Error();
      ir.data = data; ir.fresh = true; renderIR();
    }
  } catch (_) {
    if (!current() || command !== ir.command) return;
    ir.fresh = false; renderIR();
  } finally {
    if (current()) { clearTimeout(ir.timer); ir.timer = setTimeout(() => pollIR(epoch, active), 3000); }
  }
}
async function commandIR(action) {
  if ($(action === 'on' ? 'ir-on' : 'ir-off').disabled) return;
  const cage = ir.cage, epoch = ir.epoch, active = generation, command = ++ir.command;
  const csrf = ir.csrf, seconds = $('ir-seconds').value === 'continuous' ? null : Number($('ir-seconds').value), earlierOn = pendingOn.get(cage);
  const current = () => active === generation && epoch === ir.epoch && command === ir.command;
  ir.pending = action; ir.error = ''; clearTimeout(ir.timer); renderIR();
  try {
    // Preserve click order: OFF waits for a pending ON response (or its timeout).
    // It never starts another ON, even when the first request has failed.
    if (action === 'off' && earlierOn) await earlierOn.catch(() => {});
    const send = () => request('/camera/api/ir/' + encodeURIComponent(cage), {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Habitat-CSRF': csrf}, body: JSON.stringify(action === 'on' ? {action, seconds} : {action})});
    let response;
    if (action === 'on') {
      const operation = send(); pendingOn.set(cage, operation);
      try { response = await operation; }
      finally { if (pendingOn.get(cage) === operation) pendingOn.delete(cage); renderIR(); }
    } else {
      // Only an explicit OFF gets one bounded retry after a transport/server failure.
      // Repeating OFF is safe; authentication and validation failures are not retried.
      for (let attempt = 0; attempt < 2; attempt++) {
        try { response = await send(); if (response.status < 500 || attempt === 1) break; }
        catch (error) { if (attempt === 1) throw error; }
      }
    }
    if (!current()) return;
    if (response.status === 401) { loginView('연결이 만료되었습니다. 다시 연결해 주세요.'); return; }
    if (response.status === 403) { ir.canControl = false; ir.csrf = null; throw Error('제어 키를 다시 입력해 주세요.'); }
    if (!response.ok) throw Error(action === 'off' ? '끄기 응답을 확인하지 못했습니다. 상태를 확인하고 다시 눌러 주세요.' : '켜기 요청을 완료하지 못했습니다. 보드 연결과 출력 잠금을 확인해 주세요.');
    const data = await response.json();
    if (!current()) return;
    if (data.cage_id !== cage) throw Error('조명 상태를 확인하지 못했습니다.');
    ir.data = data; ir.fresh = true;
  } catch (error) {
    if (!current()) return;
    ir.fresh = false;
    ir.error = error.name === 'Error' ? error.message : '조명 응답을 확인하지 못했습니다. 상태를 확인하고 다시 눌러 주세요.';
  } finally {
    if (current()) { ir.pending = null; renderIR(); clearTimeout(ir.timer); ir.timer = setTimeout(() => pollIR(epoch, active), 100); }
  }
}

class CameraPanel {
  constructor(camera) {
    this.camera = camera; this.player = null; this.retryTimer = null; this.healthTimer = null;
    this.epoch = 0; this.sourceFresh = false; this.lastVerified = 0;
    this.element = document.createElement('article'); this.element.className = 'panel';
    const heading = document.createElement('div'); heading.className = 'panel-heading';
    this.title = document.createElement('h2');
    const retry = document.createElement('button'); retry.textContent = '다시 연결';
    retry.addEventListener('click', () => { if (this.sourceFresh) this.start(); });
    heading.append(this.title, retry);
    this.video = document.createElement('video');
    this.video.autoplay = true; this.video.muted = true; this.video.playsInline = true; this.video.controls = true;
    this.video.addEventListener('error', () => this.reconnect());
    this.status = document.createElement('p'); this.status.className = 'status'; this.status.setAttribute('role', 'status');
    this.details = document.createElement('p'); this.details.className = 'details';
    this.element.append(heading, this.video, this.status, this.details);
  }
  label(text, live = false) { this.status.textContent = text; this.status.classList.toggle('live', live); }
  stop() {
    this.epoch++; clearTimeout(this.retryTimer); clearInterval(this.healthTimer);
    this.retryTimer = null; this.healthTimer = null;
    if (this.player) { this.player.destroy(); this.player = null; }
    this.video.pause(); this.video.removeAttribute('src'); this.video.load();
  }
  unavailable(message) {
    this.sourceFresh = false; this.stop(); this.label(message);
  }
  update(camera) {
    this.camera = camera; this.title.textContent = viewNames[camera.view] || camera.id;
    const kind = ['http_mjpeg', 'rtsp_h264'].includes(camera.source_type) ? '네트워크 카메라' : 'USB 카메라';
    this.details.textContent = camera.id + ' · ' + camera.width + ' × ' + camera.height + ' · ' + kind;
    if (!camera.fresh || camera.status !== 'live') {
      this.unavailable(messages[camera.status] || '영상 연결 상태 확인 중'); return;
    }
    this.sourceFresh = true; this.lastVerified = Date.now();
    this.details.textContent += ' · 최근 영상 수신 ' + Math.round(camera.age_s || 0) + '초 전';
    if (!this.player && !this.video.getAttribute('src') && !this.retryTimer) this.start();
  }
  reconnect() {
    if (!this.sourceFresh || this.retryTimer) return;
    this.stop(); this.label('재생 재연결 중');
    const active = this.epoch;
    this.retryTimer = setTimeout(() => {
      this.retryTimer = null;
      if (active === this.epoch && this.sourceFresh) this.start();
    }, 3000);
  }
  start() {
    this.stop();
    if (!this.sourceFresh) return;
    const active = this.epoch, video = this.video;
    const path = '/camera/hls/' + encodeURIComponent(this.camera.id) + '/index.m3u8';
    this.lastTime = 0; this.lastAdvance = Date.now(); this.label('영상 수신 확인 · 재생 연결 중');
    const play = () => video.play().catch(() => {
      if (active === this.epoch) this.label('영상 수신 중 · 재생 버튼을 눌러주세요');
    });
    if (typeof Hls !== 'undefined' && Hls.isSupported()) {
      this.player = new Hls({liveSyncDurationCount: 2, liveMaxLatencyDurationCount: 4,
        maxLiveSyncPlaybackRate: 1.15, backBufferLength: 0, maxBufferLength: 12});
      this.player.on(Hls.Events.ERROR, (_, data) => {
        if (active !== this.epoch) return;
        if (data.response?.code === 401) { loginView('접속이 만료되었습니다. 다시 연결해 주세요.'); return; }
        if (data.fatal) this.reconnect();
      });
      this.player.on(Hls.Events.MANIFEST_PARSED, () => { if (active === this.epoch) play(); });
      this.player.loadSource(path); this.player.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = path; play();
    } else { this.label('이 브라우저는 영상 재생을 지원하지 않습니다.'); return; }
    this.healthTimer = setInterval(() => {
      if (active !== this.epoch) return;
      if (!this.sourceFresh || Date.now() - this.lastVerified > 8000) {
        this.unavailable('영상 연결 상태 확인 대기'); return;
      }
      if (video.currentTime > this.lastTime) {
        this.lastTime = video.currentTime; this.lastAdvance = Date.now();
        this.label('● 영상 수신 · 재생 중', true);
      } else if (video.paused) this.label('영상 수신 중 · 재생 일시 정지');
      else if (Date.now() - this.lastAdvance > 15000) this.reconnect();
    }, 1000);
  }
  destroy() { this.sourceFresh = false; this.stop(); this.element.remove(); }
}

function clearPanels() { for (const panel of panels.values()) panel.destroy(); panels.clear(); $('grid').replaceChildren(); layout = ''; }
function stopAll() { generation++; clearTimeout(pollTimer); pollTimer = null; clearPanels(); resetIR(true); }
function loginView(message = '') {
  stopAll(); $('viewer').hidden = true; $('logout').hidden = true; $('login').hidden = false; $('error').textContent = message;
}
function missingPanel(view) {
  const panel = document.createElement('article'); panel.className = 'panel';
  const title = document.createElement('h2'); title.textContent = viewNames[view];
  const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = '등록된 카메라 없음';
  panel.append(title, empty); return panel;
}
function render() {
  const cameras = inventory.filter(camera => camera.cage_id === $('cages').value);
  const positioned = cameras.some(camera => camera.view);
  const slots = positioned || !cameras.length
    ? ['top', 'front'].map(view => cameras.find(camera => camera.view === view) || {missing: view})
      .concat(cameras.filter(camera => !camera.view))
    : cameras;
  const signature = $('cages').value + ':' + slots.map(camera => camera.id || 'missing-' + camera.missing).join(',');
  if (signature !== layout) {
    clearPanels(); layout = signature;
    for (const camera of slots) {
      if (camera.missing) $('grid').append(missingPanel(camera.missing));
      else {
        const panel = new CameraPanel(camera); panels.set(camera.id, panel); $('grid').append(panel.element);
      }
    }
  }
  for (const camera of cameras) panels.get(camera.id)?.update(camera);
}
function applyListing(data) {
  inventory = data.cameras;
  const cageIds = data.cage_ids || [...new Set(inventory.map(camera => camera.cage_id))];
  const selected = $('cages').value;
  if (JSON.stringify([...$('cages').options].map(option => option.value)) !== JSON.stringify(cageIds)) {
    $('cages').replaceChildren(...cageIds.map(id => {
      const option = document.createElement('option'); option.value = id; option.textContent = id; return option;
    }));
    if (cageIds.includes(selected)) $('cages').value = selected;
  }
  $('site').textContent = data.site_id; $('notice').textContent = cageIds.length ? '' : '등록된 사육장이 없습니다';
  render(); selectIR();
}
async function poll(active) {
  try {
    const response = await request('/camera/api/cameras');
    if (active !== generation) return;
    if (response.status === 401) { loginView(); return; }
    if (!response.ok) throw Error('영상 연결 상태를 확인할 수 없습니다.');
    const data = await response.json();
    if (active !== generation) return;
    applyListing(data);
  } catch (error) {
    if (active !== generation) return;
    $('notice').textContent = '영상 연결 상태를 확인하지 못했습니다. 다시 확인 중입니다.';
    for (const panel of panels.values()) panel.unavailable('연결 상태 확인 실패');
  }
  if (active === generation) pollTimer = setTimeout(() => poll(active), 3000);
}
async function show() {
  stopAll(); const active = generation;
  const response = await request('/camera/api/cameras');
  if (active !== generation) return;
  if (response.status === 401) { loginView(); return; }
  if (!response.ok) throw Error('카메라 연결 설정을 확인해 주세요.');
  const data = await response.json();
  if (active !== generation) return;
  $('login').hidden = true; $('viewer').hidden = false; $('logout').hidden = false;
  applyListing(data); pollTimer = setTimeout(() => poll(active), 3000);
  await loadControl(active);
}
async function connect(key, unlock = false) {
  const active = generation;
  $('error').textContent = ''; $('key').value = ''; $('ir-key').value = '';
  if (unlock) { ir.error = ''; $('ir-unlock').querySelector('button').disabled = true; }
  try {
    const response = await request('/camera/session', {method: 'POST', headers: {Authorization: 'Bearer ' + key}});
    key = '';
    if (active !== generation) return;
    if (!response.ok) throw Error(response.status === 401 ? '접속 키를 확인해 주세요.' : '카메라 서비스 준비 중입니다.');
    if (unlock) {
      await loadControl(active);
      if (active !== generation) return;
      if (!ir.canControl) ir.error = '영상 키로는 IR을 조작할 수 없습니다. 제어 키를 입력해 주세요.';
      renderIR();
    } else await show().catch(() => loginView('카메라 연결 상태를 확인하고 다시 시도해 주세요.'));
  } catch (_) {
    if (active !== generation) return;
    if (unlock) { ir.error = '제어 키와 연결 상태를 확인해 주세요.'; renderIR(); }
    else loginView('접속 키와 연결 상태를 확인해 주세요.');
  } finally { key = ''; $('ir-unlock').querySelector('button').disabled = false; }
}
$('login').addEventListener('submit', event => { event.preventDefault(); connect($('key').value.trim()); });
$('ir-unlock').addEventListener('submit', event => { event.preventDefault(); connect($('ir-key').value.trim(), true); });
$('ir-on').addEventListener('click', () => commandIR('on'));
$('ir-off').addEventListener('click', () => commandIR('off'));
$('ir-seconds').addEventListener('change', renderIR);
$('logout').addEventListener('click', async () => {
  loginView(); try { await request('/camera/session', {method: 'DELETE'}); } catch (_) {}
});
$('retry').addEventListener('click', () => show().catch(() => loginView('다시 연결해 주세요.')));
$('cages').addEventListener('change', () => { render(); selectIR(); });
addEventListener('pagehide', stopAll);
addEventListener('pageshow', event => { if (event.persisted) show().catch(() => loginView('다시 연결해 주세요.')); });
if (incoming) { connect(incoming); incoming = null; } else show().catch(() => loginView('연결을 확인하고 다시 시도해 주세요.'));
</script>
</body></html>
